[package]
name = "ea"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Ea, everything anything - work with k/v's in multiple file formats, Akkadian god of wisdom, counsel, and practical knowledge"
repository = "https://github.com/rubin55/ea"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["configuration", "tree-sitter", "dotfiles", "settings"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "ea"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
tree-sitter = "0.26.12"
tree-sitter-elisp = "1.7.2"
tree-sitter-lua = "0.5.0"
tree-sitter-toml-ng = "0.7.0"
